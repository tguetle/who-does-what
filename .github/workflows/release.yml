name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release Notes aus Conventional Commits erzeugen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess

          tag = os.environ["TAG"]
          prev = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--match", "v*", f"{tag}^"],
              capture_output=True, text=True).stdout.strip()
          rng = f"{prev}..{tag}" if prev else tag
          raw = subprocess.run(
              ["git", "log", "--no-merges", "--format=%h%x1f%s%x1f%b%x1e", rng],
              capture_output=True, text=True, check=True).stdout

          pattern = re.compile(r"^(?P<type>[a-z]+)(?:\((?P<scope>[^)]+)\))?(?P<bang>!)?: (?P<desc>.+)$")
          sections = [
              ("feat", "Neue Funktionen"),
              ("fix", "Fehlerbehebungen"),
              ("perf", "Performance"),
              ("refactor", "Überarbeitungen"),
              ("docs", "Dokumentation"),
          ]
          groups = {key: [] for key, _ in sections}
          groups["other"] = []
          breaking = []

          for record in raw.split("\x1e"):
              record = record.strip()
              if not record:
                  continue
              sha, subject, body = (record.split("\x1f") + ["", ""])[:3]
              m = pattern.match(subject)
              if not m:
                  groups["other"].append(f"- {subject} ({sha})")
                  continue
              if m["type"] == "chore" and m["scope"] == "release":
                  continue
              line = f"- **{m['scope']}:** {m['desc']} ({sha})" if m["scope"] else f"- {m['desc']} ({sha})"
              if m["bang"] or "BREAKING CHANGE:" in body:
                  breaking.append(line)
              groups.get(m["type"], groups["other"]).append(line)

          out = []
          if breaking:
              out += ["## Breaking Changes", *breaking, ""]
          for key, title in sections:
              if groups[key]:
                  out += [f"## {title}", *groups[key], ""]
          if groups["other"]:
              out += ["## Sonstiges", *groups["other"], ""]
          notes = "\n".join(out).strip() or "Keine Änderungen seit dem letzten Release."
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          EOF

      - name: GitHub Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
